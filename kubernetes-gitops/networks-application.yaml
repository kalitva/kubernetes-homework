apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-networks
  namespace: argo-cd
spec:
  project: otus
  source:
    repoURL: https://github.com/kalitva/kubernetes-homework.git
    targetRevision: HEAD
    path: kubernetes-networks
  destination:
    server: https://kubernetes.default.svc
    namespace: homework
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
