defaults:
  tolerations:
  - key: "node-role"
    value: "infra"
    operator: "Equal"
    effect: "NoSchedule"
  nodeSelector:
    node-role: infra

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      bucketnames: s3-cluster-logs
      s3forcepathstyle: false
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h # 28 days retention

  storage:
    type: s3
    bucketNames:
      chunks: s3-cluster-logs
      ruler: s3-cluster-logs
      admin: s3-cluster-logs
    s3:
      # AWS endpoint URL
      endpoint: storage.yandexcloud.net
      secretAccessKey: YCPm_v9XGnYImjSUClwx-2LsSQPji8BkPEJ2Utxb
      accessKeyId: YCAJEx-6PI0Q03fd0YlOXKLhQ
      s3ForcePathStyle: false
      insecure: false

lokiCanary:
  tolerations:
  - key: "node-role"
    value: "infra"
    operator: "Equal"
    effect: "NoSchedule"
  nodeSelector:
    node-role: infra


# Disable minio storage
minio:
  enabled: false

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    accessModes:
      - ReadWriteOnce
    size: 5Gi

chunksCache:
  allocatedMemory: 512
  tolerations:
  - key: "node-role"
    value: "infra"
    operator: "Equal"
    effect: "NoSchedule"
  nodeSelector:
    node-role: infra
resultsCache:
  allocatedMemory: 256
  tolerations:
  - key: "node-role"
    value: "infra"
    operator: "Equal"
    effect: "NoSchedule"
  nodeSelector:
    node-role: infra

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
